name: Tests

# Sesión 16 (continuación), "rigor técnico restante": toda la suite es
# 100% offline (sin llamadas a Alpha Vantage/yfinance reales, ver
# docstrings de tests/) -- no hace falta ningún secret ni API key para
# que este workflow corra. Ver docs/AUDIT.md.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: pytest tests/ -v
